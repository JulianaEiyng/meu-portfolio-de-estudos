<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body {
            background-color: #8c6ce0d0;
            color: blanchedalmond;
            font:normal 20pt Arial;
        }
        h1{
            color: rgb(253, 193, 233);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p> Cada dia mais apaixonada pelo universo do Backend</p>
    <script>
  var n1 = Number.parseInt(window.prompt('Digite um número:')) // String
  var n2 = Number.parseInt(window.prompt('Digite outro número:')) // String
  var s = n1 + n2
  window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) // Concatenação
  // (number + number) para adição
  // (string + string) para concatenação
 </script>
</body>
</html>
